name: Release

# Startet bei einem Versions-Tag, z. B. `git tag v1.0.0 && git push origin v1.0.0`.
# Baut den Windows-Installer und lädt ihn + latest.yml (für Auto-Update) als
# GitHub Release hoch.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Tag muss zur package.json-Version passen
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu package.json ($pkg)"; exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: |
          npx tsc -p tsconfig.json --noEmit
          npx tsc -p tsconfig.electron.json --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npx playwright test

      - name: Installer bauen und veröffentlichen
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
