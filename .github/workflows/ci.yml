name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (web)
        run: npx tsc -p tsconfig.json --noEmit

      - name: Typecheck (electron)
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Test
        run: npm test
